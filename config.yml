#config.yml

general:              # Repeat below with GL 20, 40, 300  then  next Start at 0 and go for 1000 next time change GML to 50
  deck file name: ./DeckFiles/decks-0-410019-with_20_duplicateDecksAtEnd.csv      # Note: forward slash / form: prefix-Start#-End#-suffix no "-" allowed in prefix
  decks: list                                         # consecutive or list or GLE (See config.go for more explanation of list and GLE)
  first deck number: 10000                            # non-negative integer less than 410,000
  number of decks to be played: 1500                  # positive integer no more than 410,000 minus first deck number
  list: 10026,10061,10101,10140,10336,10360,10573,10629,10666,10705,10780,10970,10986,10998,11229,11415                             # list separated by commas #'s MUST be between FirstDeckNum and FirstDeckNum + NumberOfDecksToBePlayed - 1
  logic version: multiflip1                           # "original" logic or "multiflip1" or "multiflip2" or "multiflip3"
  type of play: playAll                               # playAll or playOrig
  verbose: 0                                          # non-negative integer
  outputTo: ./playAllPrintOutput/Decks                # console OR filename WITHOUT extension;             ./playAllPrintOutput/Decks
                                                      # filename will be appended with deck range, GLL and
                                                      #     datetime stamp and extension ".txt" (See Further comments below)
                                                      # ./playOrigLossesOutput/filename or ./playAllPrintOutput/filename are suggested

play original:
  length of initial override strategy: 0             # non-negative integer
  game length limit in moves made: 150                # non-negative integer



play all moves:
  game length limit in million moves tried: 280     # IN MILLIONS non-negative integer

  find all winning strategies?: false               # true or false   true not yet implemented

  reporting:                                        # only one true or no trues permitted   non yaml       cfg.PlayNew.ReportingType.NoReporting set in code
    deck by deck: true                              # true or false                                   =    cfg.PlayNew.ReportingType.DeckByDeck
    move by move: false                             # true or false                                     || cfg.PlayNew.ReportingType.MoveByMove
    tree: false                                     # true or false                                     || cfg.PlayNew.ReportingType.Tree
    #                                             NOTE: || == OR (looks like forward slash due to italics)
  deck by deck reporting options:
    type: short                                   # regular, short, very short     Ignored if cfg.PlayAll.ReportingType.DeckByDeck == false

  move by move reporting options:
    type: regular                                 # regular, short, very short     Ignored if cfg.PlayAll.ReportingType.MoveByMove == false

  tree reporting options:
    type: regular                                 # regular, narrow, very narrow   All 3 Ignored if cfg.PlayAll.ReportingType.Tree == false
    sleep between moves: 0                        # non-negative integer, in tenths of seconds   Slow down so humans can follow
    sleep between strategies: 0                   # non-negative integer, in tenths of seconds   Slow down so humans can follow

  restrict reporting to:
    starting deck number: 0                         # 0 means no restriction
    continue for how many decks: 0                  # 0 means no restriction
    starting move number: 0                         # 0 means no restriction
    continue for how many moves: 0                  # 0 means no restriction

  print winning moves: false                        # true or false
  progress counter in millions: 5                   # Applicable All reporting when OutputTo != "console"
                                                    # and only to Deck-by-Deck reporting when OutputTo == "console"
  print final deck by deck W/L record: true         # true or false  (See Further comments below)
  save results to SQL: true                         # true or false
  sql connection string: "sqlDbConnect.go"
                                                    # actual connection string or "sqlDbConnect.go" which uses sqlDbConnect.env file
                                                    # example: server=DANACER\\SQLEXPRESS;port=1433;user id=@DANACER\\dan@;password=@password@;database=Klondike
                                                    #		// NOTE Double BackSlashes !!!!!!!!!!!
                                                    #		// Replace @...@ with actual

    # Further comments regarding the outputTo filename:

    # filename will be appended with:
    #        If Decks == "consecutive" {
    #          "_" + first deck number-last deck number (i.e. cfg.General.FirstDeckNum + cfg.General.NumberOfDecksToBePlayed - 1)
    #          "_GLE" + cfg.PlayAll.GameLengthLimit or cfg.PlayOrig.GameLengthLimit
    #        } else { "list" }
    #        "_" + datetime stamp and extension ".txt"
